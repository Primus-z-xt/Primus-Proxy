name: Validate Primus Proxy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Worker and Builder regressions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker compatibility tests
        run: node cloudflare/primus-config.test.mjs
      - name: Auto-select, defaults, and Loon snapshot tests
        run: node cloudflare/primus-config.auto-select.test.mjs
      - name: REALITY compatibility and empty-choice validation
        run: node cloudflare/primus-config.reality.test.mjs
      - name: Configuration naming and header safety
        run: node cloudflare/primus-config.name.test.mjs
