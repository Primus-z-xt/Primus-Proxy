name: One-off Emby UI layout fix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/oneoff-emby-ui-fix.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  patch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply UI patch
        run: python scripts/oneoff-emby-ui-fix.py

      - name: Prepare Pages
        run: |
          rm -rf _site
          mkdir -p _site
          cp builder/index.html _site/index.html
          cp builder/app.js _site/app.js
          cp builder/emby-region.js _site/emby-region.js
          cp VERSION.json _site/VERSION.json
          cp mihomo/template.yaml _site/template.yaml
          cp loon/Primus-Loon.lcf _site/Primus-Loon.lcf
          cp loon/template.lcf _site/Loon-template.lcf

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit UI fix
        run: |
          rm -rf _site
          rm -f scripts/oneoff-emby-ui-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builder/index.html scripts/oneoff-emby-ui-fix.py
          git diff --cached --quiet && exit 0
          git commit -m "Polish Emby region selector layout"
          git push origin HEAD:main
