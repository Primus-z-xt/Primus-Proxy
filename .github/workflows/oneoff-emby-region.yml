name: One-off Emby region filter patch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/oneoff-emby-region.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  patch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch script
        run: python scripts/oneoff-emby-region.py

      - name: Validate JavaScript
        run: |
          node --check builder/emby-region.js
          node --check cloudflare/primus-config.js

      - name: Prepare Pages
        run: |
          rm -rf _site
          mkdir -p _site
          cp builder/index.html _site/index.html
          cp builder/app.js _site/app.js
          cp builder/emby-region.js _site/emby-region.js
          cp VERSION.json _site/VERSION.json
          cp mihomo/template.yaml _site/template.yaml
          cp loon/Primus-Loon.lcf _site/Primus-Loon.lcf
          cp loon/template.lcf _site/Loon-template.lcf

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit patched production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add Emby region filtering"
          git push origin HEAD:main
