name: One-off Loon Emby Worker region fix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/oneoff-emby-loon-worker-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply Worker fix
        run: python scripts/oneoff-emby-loon-worker-fix.py
      - name: Validate Worker
        run: node --check cloudflare/primus-config.js
      - name: Commit Worker fix
        run: |
          rm -f scripts/oneoff-emby-loon-worker-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/primus-config.js scripts/oneoff-emby-loon-worker-fix.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix Loon Emby region filtering"
          git push origin HEAD:main
