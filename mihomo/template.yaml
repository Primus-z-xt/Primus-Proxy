# ============================================================
# Primus Mihomo / Clash
# 文件名：Primus-Mihomo.yaml
# 版本：v2
# 更新日期：2026-09-20 11:35:14
#
# 节点来源：机场 / 自建 / 备用
# 日用：来源可选 + 地区多选；AI：固定美国 + 来源可选
# 所有策略均为手动选择，不使用 url-test / fallback / load-balance
# ============================================================

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

# -------------------------
# GEO 数据
# -------------------------
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb"
  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"

# -------------------------
# 节点来源
# 此区块由 Primus Builder / primus-config 根据“来源 + 地区”动态生成
# -------------------------
proxy-providers:
__PROXY_PROVIDERS__

# -------------------------
# 远程规则
# -------------------------
rule-providers:
  AI:
    type: http
    behavior: classical
    format: yaml
    path: ./rule_provider/ai.yaml
    url: "https://kelee.one/Tool/Clash/Rule/AI.yaml"
    interval: 86400
    proxy: DIRECT

  DouYin:
    type: http
    behavior: classical
    format: yaml
    path: ./rule_provider/douyin.yaml
    url: "https://rule.kelee.one/Clash/DouYin.yaml"
    interval: 86400
    proxy: DIRECT

  XiaoHongShu:
    type: http
    behavior: classical
    format: yaml
    path: ./rule_provider/xiaohongshu.yaml
    url: "https://rule.kelee.one/Clash/XiaoHongShu.yaml"
    interval: 86400
    proxy: DIRECT

  SpeedtestInternational:
    type: http
    behavior: classical
    format: yaml
    path: ./rule_provider/speedtest-international.yaml
    url: "https://kelee.one/Tool/Clash/Rule/SpeedtestInternational.yaml"
    interval: 86400
    proxy: DIRECT

# -------------------------
# DNS
# -------------------------
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  proxy-server-nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"

# -------------------------
# 域名嗅探
# -------------------------
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.push.apple.com"

# -------------------------
# 策略组
# 此区块由 Primus Builder / primus-config 根据选择动态生成
# -------------------------
proxy-groups:
__PROXY_GROUPS__

# -------------------------
# 分流规则
# 专项规则优先；LAN / CN 靠后；最终进入全球代理策略
# -------------------------
rules:
  # 固定直连
  - DOMAIN-SUFFIX,4ktop.com,DIRECT

  # 广告
  - GEOSITE,category-ads-all,REJECT

  # AI：地区固定美国，来源由 Builder 选择
  - RULE-SET,AI,🤖 AI

  # 番茄
  - DOMAIN-SUFFIX,fanqienovel.com,🍅 番茄
  - DOMAIN,novel.snssdk.com,🍅 番茄
  - DOMAIN,reading.snssdk.com,🍅 番茄

  # 抖音 / 小红书 / 国际测速
  - RULE-SET,DouYin,🎵 抖音
  - RULE-SET,XiaoHongShu,📕 小红书
  - RULE-SET,SpeedtestInternational,🌐 全球代理策略

  # Apple / Microsoft 中国区直连；海外最终进入全球代理策略
  - GEOSITE,apple-cn,DIRECT
  - GEOSITE,microsoft@cn,DIRECT

  # 局域网 / 私有网络
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve

  # 中国大陆
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve

  # 最终兜底
  - MATCH,🌐 全球代理策略
